{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly"
      },
      "groups": {
        "codeql": {
          "patterns": [
            "github/codeql-action/*"
          ]
        }
      }
    },
    {
      "package-ecosystem": "pip",
      "directory": "/",
      "schedule": {
        "interval": "daily"
      },
      "groups": {
        "python-minor-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    },
    {
      "package-ecosystem": "pip",
      "directory": "/security",
      "schedule": {
        "interval": "daily"
      },
      "groups": {
        "python-minor-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      }
    }
  ]
}
